<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rachel & Ethan · Baby Shower Trivia</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4ec;color:#26382f;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.load{text-align:center;padding:28px}.mark{width:58px;height:58px;margin:0 auto 14px;border-radius:19px;background:#e5ece3;display:grid;place-items:center;color:#415143;font-size:2rem;overflow:hidden;box-shadow:0 8px 22px rgba(38,56,47,.12)}.mark img{width:100%;height:100%;object-fit:cover;display:block}h1{font-size:1.45rem;margin:0 0 8px}p{color:#687d72;font-weight:700;margin:0}
</style>
</head>
<body><main class="load"><div class="mark"><span id="markFallback">🐢</span><img id="markImg" alt="" hidden></div><h1>Baby Shower Trivia</h1><p id="status">Loading game…</p></main>
<script>
const SOURCE='https://rachel-ethan-baby-shower-default-rtdb.firebaseio.com/deploy/reloadSafeIndex.json';
const LOGO='https://rachel-ethan-baby-shower-default-rtdb.firebaseio.com/deploy/turtleLogo.json';
const EXPECTED='9aeb7d78ec7391ae6766a4f13f5b8ba196efe3d099a0e9cef26bcbd724d7fed8';
const status=document.getElementById('status');
fetch(LOGO,{cache:'force-cache'}).then(r=>r.ok?r.json():null).then(logo=>{if(typeof logo==='string'&&logo.startsWith('data:image/')){const img=document.getElementById('markImg');img.src=logo;img.hidden=false;document.getElementById('markFallback').hidden=true}}).catch(()=>{});
async function sha256(text){const data=new TextEncoder().encode(text);const digest=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('')}
async function boot(){try{status.textContent='Loading game…';const response=await fetch(SOURCE,{cache:'no-store'});if(!response.ok)throw new Error('Game download failed');const html=await response.json();if(typeof html!=='string'||!html.includes('loadingView'))throw new Error('Game package is invalid');if(await sha256(html)!==EXPECTED)throw new Error('Game integrity check failed');document.open();document.write(html);document.close()}catch(error){console.error(error);status.textContent='The game could not load. Please refresh.'}}
boot();
</script>
</body>
</html>

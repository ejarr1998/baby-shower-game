.card{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,253,.98),rgba(255,252,244,.96));border:1px solid rgba(231,224,209,.95);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}.card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--teal),#8ed0c1,var(--sand));opacity:.8}.hero{text-align:center;padding:20px 8px 22px}.hero .eyebrow{color:var(--teal2);font-weight:950;text-transform:uppercase;letter-spacing:.16em;font-size:.78rem}.hero h1{font-family:'Fredoka One';font-size:clamp(2.15rem,9.5vw,3.4rem);line-height:1.03;margin-top:8px}.hero p{color:var(--muted);font-weight:750;margin-top:10px}.label{display:block;font-weight:900;margin:16px 0 8px}.field input{width:100%;border:1px solid var(--line);background:#fff;border-radius:17px;padding:16px 17px;color:var(--ink);outline:none;transition:.16s;box-shadow:inset 0 1px 0 rgba(22,50,61,.03)}.field input:focus{border-color:var(--teal);box-shadow:0 0 0 5px rgba(45,125,118,.14)}.row{display:flex;gap:10px}.btn{border:0;border-radius:17px;padding:15px 16px;font-weight:950;cursor:pointer;transition:transform .14s,filter .14s,opacity .14s,box-shadow .14s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:active{transform:translateY(1px) scale(.99)}.btn:disabled{opacity:.5;cursor:not-allowed}.primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;width:100%;margin-top:16px;box-shadow:0 16px 30px rgba(45,125,118,.25)}.primary:hover{filter:brightness(1.04)}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:0 8px 18px rgba(22,50,61,.06)}.ghost{background:rgba(255,255,255,.55);border:1px dashed #bfded7;color:var(--teal2);width:100%;margin-top:14px}.mini{padding:10px 13px;border-radius:13px;font-size:.9rem}.hint{text-align:center;color:var(--muted);font-size:.92rem;font-weight:750;margin-top:12px;line-height:1.4}.players{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-weight:850;color:var(--ink);box-shadow:0 6px 14px rgba(22,50,61,.05);animation:pop .22s ease both}@keyframes pop{from{transform:scale(.9);opacity:0}}.host{margin-top:16px;border:1px solid #d5ebe5;background:linear-gradient(180deg,#f2fbf9,#fff);border-radius:19px;padding:15px}.host h3{font-size:1rem;margin-bottom:10px}.status{display:flex;align-items:center;gap:10px;margin-bottom:16px}.progress{height:11px;border-radius:99px;background:#e8eeea;overflow:hidden;box-shadow:inset 0 1px 2px rgba(22,50,61,.06)}.progress>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--teal),#84ccb);background:linear-gradient(90deg,var(--teal),#83cbbf);transition:width .1s linear}.qnum{font-weight:950;color:var(--muted);white-space:nowrap}.timer{min-width:50px;text-align:center;border-radius:15px;background:var(--ink);color:#fff;padding:10px 11px;font-weight:950;box-shadow:var(--soft)}.timer.low{background:linear-gradient(135deg,var(--bad),#a63d33);animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.07)}}.q{font-size:clamp(1.45rem,6.4vw,2.05rem);line-height:1.23;font-weight:950;margin:12px 0 18px;letter-spacing:-.02em}.answers{display:grid;gap:11px}.answer{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px 16px 16px 56px;position:relative;text-align:left;font-weight:900;color:var(--ink);box-shadow:0 10px 22px rgba(22,50,61,.07);transition:transform .14s,border-color .14s,background .14s,opacity .14s,box-shadow .14s}.answer:before{content:attr(data-letter);position:absolute;left:15px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--teal2);font-weight:950}.answer:hover{transform:translateY(-1px);border-color:#bcdcd5;box-shadow:0 14px 28px rgba(22,50,61,.1)}.answer:active{transform:scale(.99)}.answer{padding-right:58px}.answer:after{content:"";position:absolute;right:15px;top:50%;min-width:24px;height:24px;padding:0 7px;border-radius:999px;display:grid;place-items:center;background:#5b6d74;color:#fff;font-size:.62rem;font-weight:950;letter-spacing:.05em;transform:translateY(-50%) scale(0);transition:transform .16s}.answer.selected{border:2px solid #53676f;background:#f2f5f4;box-shadow:0 0 0 5px rgba(22,50,61,.10)}.answer.selected:after{content:"LOCK";transform:translateY(-50%) scale(1)}.answers.locked{pointer-events:none}.answers.locked .answer:not(.selected){opacity:.4}.answer.correct{border-color:var(--good);background:#effaf2;color:var(--good)}.answer.correct:before{content:"✓";background:#dcf4e5;color:var(--good)}.answer.wrong{border-color:var(--bad);background:#fff1ef;color:var(--bad);opacity:.74}.answer.wrong:before{content:"×";background:#fbe4e1;color:var(--bad)}.banner{border-radius:20px;padding:17px;text-align:center;color:#fff;font-weight:950;font-size:1.22rem;margin-bottom:15px;box-shadow:var(--soft)}.banner.good{background:linear-gradient(135deg,var(--good),#237647)}.banner.bad{background:linear-gradient(135deg,var(--bad),#a63d33)}.banner.info{background:linear-gradient(135deg,var(--teal),var(--teal2))}.board{display:grid;gap:10px;margin-top:15px}.brow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 15px;box-shadow:0 8px 18px rgba(22,50,61,.05)}.brow:first-child{border-color:#ead493;background:linear-gradient(180deg,#fffdf0,#fff)}.rank{width:36px;text-align:center;font-weight:950}.name{flex:1;font-weight:900}.pts{font-weight:950;color:var(--teal2)}.center{text-align:center}.big{font-family:'Fredoka One';font-size:clamp(5rem,30vw,9.5rem);line-height:1;color:var(--teal2);text-shadow:0 8px 0 rgba(45,125,118,.08)}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,140%);background:var(--ink);color:#fff;border-radius:15px;padding:12px 16px;font-weight:900;box-shadow:var(--shadow);transition:.22s;z-index:30;max-width:min(92vw,540px);text-align:center}.toast.show{transform:translate(-50%,0)}.footer{margin-top:auto;padding-top:20px;text-align:center;color:#93a5ab;font-size:.78rem;font-weight:800}.btn:focus-visible,.answer:focus-visible,input:focus-visible{outline:4px solid rgba(45,125,118,.3);outline-offset:2px}@media(min-width:560px){.answers{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body><main class="app">

<script>
const ADJECTIVES=["Salty","Hairy","Tiny","Sleepy","Bubbly","Wavy","Sandy","Coral","Pearly","Jolly","Squishy","Splashy","Dizzy","Cozy","Snuggly","Giggly","Wiggly","Chubby","Sunny","Misty","Breezy","Stormy","Foggy","Icy","Toasty","Marshmallow","Pickled","Peppery","Buttery","Crabby","Happy","Grumpy","Sassy","Classy","Fancy","Dapper","Wobbly","Goofy","Loopy","Zippy","Drowsy","Cheeky","Sneaky","Squeaky","Bumpy","Lumpy","Fuzzy","Huffy","Puffy","Scruffy","Fluffy","Itchy","Twitchy","Glowing","Floating","Drifting","Diving","Surfing","Snoozing","Dancing","Prancing","Singing","Barking","Chirpy","Burpy","Hiccuping","Napping","Munching","Slurping","Glimmering"];
const NOUNS=["Squid","Octopus","Turtle","Seahorse","Starfish","Blowfish","Whale","Otter","Seal","Walrus","Penguin","Puffin","Pelican","Crab","Lobster","Shrimp","Clam","Oyster","Mussel","Scallop","Jellyfish","Manatee","Narwhal","Dolphin","Porpoise","Ray","Eel","Anchovy","Sardine","Herring","Cod","Salmon","Tuna","Guppy","Goldfish","Betta","Koi","Frog","Tadpole","Newt","Axolotl","Barnacle","Urchin","Sponge","Coral","Kelp","Reef","Wave","Tide","Lagoon","Cove","Shell","Pearl","Sand Dollar","Sea Cucumber","Sea Lion","Sea Slug","Cuttlefish","Krill","Plankton","Albatross","Heron","Sandpiper","Tern","Gull","Fin","Flipper","Bubble","Splash","Current"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function randName(){return pick(ADJECTIVES)+' '+pick(NOUNS)}

const firebaseConfig={apiKey:"AIzaSyCm12-J2SiwF2Sn0ETOMeke-bSAI5CFA-o",authDomain:"rachel-ethan-baby-shower.firebaseapp.com",databaseURL:"https://rachel-ethan-baby-shower-default-rtdb.firebaseio.com",projectId:"rachel-ethan-baby-shower",storageBucket:"rachel-ethan-baby-shower.firebasestorage.app",messagingSenderId:"126245184635",appId:"1:126245184635:web:9fec26e83cd40c338eede"};firebase.initializeApp(firebaseConfig);const db=firebase.database(),fs=firebase.firestore();const $=id=>document.getElementById(id);const TIMER=15,LEADERBOARD_SECONDS=6,REVEAL_MS=1800,COUNTDOWN_MS=3600;let offset=0,deviceId=localStorage.getItem('bsDeviceId')||'d_'+Math.random().toString(36).slice(2)+Date.now().toString(36),playerId=localStorage.getItem('bsPlayerId')||null,playerName=localStorage.getItem('bsPlayerName')||'',isHost=false,host=null,state=null,players=[],questions=[],joined=false,myChoice=null,pending=0,scored=false,timer=null,phaseClock=null,taps=[];localStorage.setItem('bsDeviceId',deviceId);
const now=()=>Date.now()+offset;function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cleanName(n){n=String(n||'').trim();if(!n||n==='undefined'||n==='null')n=randName();return n.slice(0,24)}function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2400)}function show(id){['joinView','lobbyView','countView','qView','revealView','boardView','finalView'].forEach(v=>$(v).classList.toggle('active',v===id))}function buzz(p){if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}function loadQuestions(){return fs.collection('questions').orderBy('order').limit(15).get().then(s=>{questions=s.docs.map(d=>({id:d.id,...d.data()}))}).catch(()=>{questions=[]})}
function milestones(total){return [5,10,total].filter((v,i,a)=>v<=total&&a.indexOf(v)===i).sort((a,b)=>a-b)}
function bind(){db.ref('.info/serverTimeOffset').on('value',s=>offset=s.val()||0);db.ref('host').on('value',s=>{host=s.val();isHost=!!(host&&host.deviceId===deviceId);renderHost()});db.ref('players').on('value',s=>{players=Object.entries(s.val()||{}).map(([id,v])=>({id,...v}));renderPlayers()});db.ref('gameState').on('value',s=>{state=s.val();clearTimeout(timer);render()});$('randomBtn').onclick=()=>{$('nameInput').value=randName();buzz(10)};$('shareBtn').onclick=async()=>{const url=location.origin+location.pathname;try{if(navigator.share)await navigator.share({title:'Baby Shower Trivia',url});else{await navigator.clipboard.writeText(url);toast('Link copied')}}catch(e){}};$('joinBtn').onclick=join;$('startBtn').onclick=()=>startGame(false);$('restartBtn').onclick=resetToLobby;$('nextBtn').onclick=()=>{if(isHost&&state&&state.phase==='leaderboard')advanceFromBoard(state)};$('againBtn').onclick=resetToLobby;$('endBtn').onclick=()=>{if(isHost&&confirm('End the game and return to lobby?'))resetToLobby()};$('gameTitle').onclick=()=>{const t=Date.now();taps=taps.filter(x=>t-x<2600);taps.push(t);if(taps.length>=10){taps=[];claimHost()}};if(playerId&&playerName){joined=true;$('joinView').classList.remove('active');show('lobbyView')}loadQuestions()}
function claimHost(){db.ref('host').set({deviceId,claimedAt:now()}).then(()=>{isHost=true;renderHost();toast('Host unlocked')})}
function join(){const name=cleanName($('nameInput').value);playerName=name;playerId=playerId||'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);localStorage.setItem('bsPlayerId',playerId);localStorage.setItem('bsPlayerName',playerName);db.ref('players/'+playerId).update({name:playerName,deviceId,joinedAt:now(),score:0,answered:false,lastChoice:null,lastCorrect:null,answerAt:null}).then(()=>{joined=true;buzz(15);show('lobbyView');render()})}
function resetPlayers(clearScores){return db.ref('players').once('value').then(s=>{const u={};s.forEach(c=>{u[c.key+'/answered']=false;u[c.key+'/lastChoice']=null;u[c.key+'/lastCorrect']=null;u[c.key+'/answerAt']=null;if(clearScores)u[c.key+'/score']=0});return db.ref('players').update(u)})}
function resetToLobby(){if(!isHost)return;resetPlayers(true).then(()=>db.ref('gameState').set({phase:'lobby',currentIndex:0,total:0,milestones:[],questionEndsAt:null,revealEndsAt:null,leaderboardEndsAt:null,updatedAt:now()})).then(()=>toast('Back to lobby'))}
function startGame(restart){if(!isHost)return toast('Host only');if(!questions.length)return toast('No preset questions found');const total=Math.min(15,questions.length);resetPlayers(true).then(()=>db.ref('gameState').set({phase:'countdown',currentIndex:0,total,milestones:milestones(total),countdownEndsAt:now()+COUNTDOWN_MS,questionEndsAt:null,revealEndsAt:null,leaderboardEndsAt:null,updatedAt:now()})).then(()=>toast(restart?'Game restarted':'Game starting'))}
function tx(match,update){return db.ref('gameState').transaction(cur=>{if(!cur)return;if(Object.keys(match).every(k=>cur[k]===match[k]))return{...cur,...update,updatedAt:now()};return})}
function schedule(st){clearTimeout(timer);const t=now();if(st.phase==='countdown')timer=setTimeout(()=>tx({phase:'countdown',currentIndex:st.currentIndex},{phase:'question',questionEndsAt:now()+TIMER*1000,revealEndsAt:null,leaderboardEndsAt:null}),Math.max(200,(st.countdownEndsAt||t)-t));if(st.phase==='question')timer=setTimeout(()=>tx({phase:'question',currentIndex:st.currentIndex},{phase:'reveal',revealEndsAt:now()+REVEAL_MS}),Math.max(200,(st.questionEndsAt||t)-t));if(st.phase==='reveal')timer=setTimeout(()=>{const n=st.currentIndex+1;if((st.milestones||[]).includes(n))tx({phase:'reveal',currentIndex:st.currentIndex},{phase:'leaderboard',leaderboardEndsAt:now()+LEADERBOARD_SECONDS*1000});else tx({phase:'reveal',currentIndex:st.currentIndex},{phase:'question',currentIndex:n,questionEndsAt:now()+TIMER*1000})},Math.max(200,(st.revealEndsAt||t)-t));if(st.phase==='leaderboard')timer=setTimeout(()=>advanceFromBoard(st),Math.max(300,(st.leaderboardEndsAt||t)-t+200))}
function advanceFromBoard(st){const n=st.currentIndex+1;if(n>=st.total){tx({phase:'leaderboard',currentIndex:st.currentIndex},{phase:'finished'});return}tx({phase:'leaderboard',currentIndex:st.currentIndex},{phase:'question',currentIndex:n,questionEndsAt:now()+TIMER*1000,leaderboardEndsAt:null}).then(r=>{if(r.committed)db.ref('players').once('value').then(s=>{const u={};s.forEach(c=>{u[c.key+'/answered']=false;u[c.key+'/lastChoice']=null;u[c.key+'/lastCorrect']=null;u[c.key+'/answerAt']=null});db.ref('players').update(u)})})}
function render(){const st=state;if(!joined)return show('joinView');if(!st||st.phase==='lobby'){show('lobbyView');return}show(st.phase==='countdown'?'countView':st.phase==='question'?'qView':st.phase==='reveal'?'revealView':st.phase==='leaderboard'?'boardView':'finalView');schedule(st);renderPhase(st);if(st.phase==='countdown')renderCount(st);if(st.phase==='question')renderQuestion(st);if(st.phase==='reveal')renderReveal(st);if(st.phase==='leaderboard')renderBoard(st,false);if(st.phase==='finished')renderBoard(st,true)}
function renderPhase(st){const names={countdown:'Starting',question:'Question',reveal:'Reveal',leaderboard:'Leaderboard',finished:'Finished',lobby:'Lobby'};$('phasePill').textContent=names[st.phase]||'Lobby'}
function renderPlayers(){const list=players.filter(p=>!p.isHost);$('playerCount').textContent=list.length;$('players').innerHTML=list.map(p=>`<span class="chip">${esc(p.name||'Player')}</span>`).join('');$('lobbySub').textContent='Waiting for the host…'}
function renderHost(){const showHost=isHost;$('hostPanel').hidden=!showHost;$('nextPanel').hidden=!(showHost&&state&&state.phase==='leaderboard');$('finalHost').hidden=!(showHost&&state&&state.phase==='finished');$('autoNext').hidden=showHost&&state&&state.phase==='leaderboard';$('endBtn').hidden=!(showHost&&state&&['countdown','question','reveal','leaderboard'].includes(state.phase))}
function renderCount(st){const end=st.countdownEndsAt||now()+COUNTDOWN_MS;clearInterval(phaseClock);const f=()=>{const left=Math.max(0,end-now());$('countNum').textContent=left>2600?'3':left>1700?'2':left>800?'1':'Go';$('countSub').textContent=`Question 1 of ${st.total}`;if(left<=0)clearInterval(phaseClock)};f();phaseClock=setInterval(f,80)}
function answers(q,locked){return q.answers.slice(0,4).map((a,i)=>`<button class="answer" data-letter="${'ABCD'[i]}" data-i="${i}" ${locked?'disabled':''}>${esc(a)}</button>`).join('')}
function renderQuestion(st){const q=questions[st.currentIndex];if(!q)return;scored=false;myChoice=null;pending=0;$('qNow').textContent=st.currentIndex+1;$('qTotal').textContent=st.total;$('qText').textContent=q.text;const box=$('answers');box.classList.remove('locked');box.innerHTML=answers(q,false);box.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(st,Number(b.dataset.i)));$('lockHint').hidden=true;clearInterval(phaseClock);$('timer').textContent=TIMER;$('timer').classList.remove('low');const end=st.questionEndsAt||now()+TIMER*1000;const f=()=>{const left=Math.max(0,end-now());const secs=Math.ceil(left/1000);$('timer').textContent=secs;$('timer').classList.toggle('low',secs<=5);$('bar').style.width=(left/(TIMER*1000)*100)+'%';if(left<=0)clearInterval(phaseClock)};f();phaseClock=setInterval(f,100)}
function choose(st,i){const me=players.find(p=>p.id===playerId);if(!playerId||!st||st.phase!=='question'||now()>(st.questionEndsAt||0)||(me&&me.answered))return;const q=questions[st.currentIndex],ok=i===q.correctIndex;myChoice=i;pending=ok?100+Math.round(Math.max(0,(st.questionEndsAt||now())-now())/1000)*5:0;db.ref('players/'+playerId).update({answered:true,lastChoice:i,lastCorrect:ok,answerAt:now()});const box=$('answers');box.classList.add('locked');box.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(Number(b.dataset.i)===i)b.classList.add('selected')});$('lockHint').hidden=false;buzz(18)}
function renderReveal(st){const q=questions[st.currentIndex];if(!q)return;const me=players.find(p=>p.id===playerId);const ok=me&&me.lastCorrect;if(!scored&&playerId&&me&&me.answered){scored=true;if(ok){db.ref('players/'+playerId+'/score').set((me.score||0)+pending)}}const banner=$('revealBanner');banner.className='banner '+(me&&me.answered?ok?'good':'bad':'info');banner.textContent=me&&me.answered?ok?`Correct +${pending}`:'Not quite':'Time’s up';$('revealQ').textContent=q.text;$('revealAnswers').innerHTML=answers(q,true);$('revealAnswers').querySelectorAll('.answer').forEach(b=>{const i=Number(b.dataset.i);if(i===q.correctIndex)b.classList.add('correct');if(me&&i===me.lastChoice&&!ok)b.classList.add('wrong')})}
function renderBoard(st,final){const list=players.filter(p=>!p.isHost).sort((a,b)=>(b.score||0)-(a.score||0));const html=list.map((p,i)=>`<div class="brow"><span class="rank">${final?['🥇','🥈','🥉'][i]||'⭐':i+1}</span><span class="name">${esc(p.name||'Player')}</span><span class="pts">${p.score||0}</span></div>`).join('');if(final){$('winner').textContent=list[0]?`${list[0].name} wins`:'Game over';$('finalList').innerHTML=html}else{$('boardTitle').textContent='Leaderboard';$('boardSub').textContent=`After question ${st.currentIndex+1} of ${st.total}`;$('boardList').innerHTML=html;const end=st.leaderboardEndsAt||now();clearInterval(phaseClock);const f=()=>{const left=Math.max(0,end-now());$('autoNext').textContent=left>0?`${Math.ceil(left/1000)}`:'…';if(left<=0)clearInterval(phaseClock)};f();phaseClock=setInterval(f,250)}renderHost()}
window.addEventListener('load',bind);
</script></body></html>

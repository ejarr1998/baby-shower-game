<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baby Shower Trivia</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf3e7;color:#3d2c1e;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.load{text-align:center;padding:28px}.mark{width:58px;height:58px;margin:0 auto 14px;border-radius:19px;background:#f3e6d2;display:grid;place-items:center;color:#6b4f33;font-size:2rem;overflow:hidden;box-shadow:0 8px 22px rgba(61,44,30,.12)}.mark img{width:100%;height:100%;object-fit:cover;display:block}h1{font-size:1.45rem;margin:0 0 8px}p{color:#8a7360;font-weight:700;margin:0}
</style>
</head>
<body><main class="load"><div class="mark"><span id="markFallback">🥟</span><img id="markImg" alt="" hidden></div><h1>Baby Shower Trivia</h1><p id="status">Loading game…</p></main>
<script>
const SOURCE='https://rachel-ethan-baby-shower-default-rtdb.firebaseio.com/deploy/reloadSafeIndex.json';
const LOGO='https://rachel-ethan-baby-shower-default-rtdb.firebaseio.com/deploy/turtleLogo.json';
const EXPECTED=['f06ac6e7705e644f35de3013b3d9d820f9166303a2fd17422b6101af266490e8','c10732f64426fada3dd74f733d810ed125a633a395d867346895ecf5bbc1528e'];
const status=document.getElementById('status');
fetch(LOGO,{cache:'force-cache'}).then(r=>r.ok?r.json():null).then(logo=>{if(typeof logo==='string'&&logo.startsWith('data:image/')){const img=document.getElementById('markImg');img.src=logo;img.hidden=false;document.getElementById('markFallback').hidden=true}}).catch(()=>{});
async function sha256(text){const data=new TextEncoder().encode(text);const digest=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('')}
async function boot(){try{status.textContent='Loading game…';const response=await fetch(SOURCE,{cache:'no-store'});if(!response.ok)throw new Error('Game download failed');const html=await response.json();if(typeof html!=='string'||!html.includes('loadingView'))throw new Error('Game package is invalid');if(!EXPECTED.includes(await sha256(html)))throw new Error('Game integrity check failed');document.open();document.write(html);document.close()}catch(error){console.error(error);status.textContent='The game could not load. Please refresh.'}}
boot();
</script>
</body>
</html>

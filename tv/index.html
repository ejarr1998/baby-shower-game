const q=questions[st.currentIndex];if(!questionsReady||!q){$('centerState').hidden=false;$('questionBlock').hidden=true;$('joinLink').hidden=true;$('bigMessage').textContent='Loading';$('subMessage').textContent='Restoring the live game…';return}
$('centerState').hidden=true;$('questionBlock').hidden=false;$('qCount').textContent=`Question ${st.currentIndex+1} of ${st.total||questions.length}`;$('questionText').textContent=q.text||'';$('questionBlock').classList.toggle('longQ',(q.text||'').length>90);$('timerText').textContent=phase==='question'?'15':'✓';$('timerBar').style.width=phase==='question'?'100%':'0%';$('answerGrid').innerHTML=(q.answers||[]).slice(0,4).map((a,i)=>optionHtml(a,i,q,st,phase==='reveal')).join('');if(phase==='question')startQuestionClock(st)}
function render(){renderSide();const st=state,phase=st?st.phase:'lobby',names={lobby:'Lobby',countdown:'Starting',question:'Question',reveal:'Reveal',leaderboard:'Leaderboard',finished:'Finished'};$('phasePill').textContent=names[phase]||'Lobby';const boardMode=phase==='leaderboard'||phase==='finished';$('stage').hidden=boardMode;$('fullBoard').hidden=!boardMode;if(boardMode){clearInterval(clock);renderFullBoard(phase==='finished')}else{renderPlay(st)}if(phase!=='finished')$('confetti').hidden=true}
async function toggleFullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}}
function bind(){db.ref('.info/serverTimeOffset').on('value',s=>offset=s.val()||0);db.ref('players').on('value',s=>{players=Object.entries(s.val()||{}).map(([id,v])=>({id,...v}));playersReady=true;render()});db.ref('gameState').on('value',s=>{state=s.val();render()});$('fullBtn').onclick=toggleFullscreen;loadLogo();loadQuestions();render()}
window.addEventListener('load',bind);
</script>
